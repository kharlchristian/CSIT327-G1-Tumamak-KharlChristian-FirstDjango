<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --cc-primary: #8B1A1A;
            --cc-primary-hover: #6B1414;
            --cc-primary-light: #A52A2A;
            --cc-bg: #FAFAFA;
            --cc-card-bg: #FFFFFF;
        }
        body {
            background-color: var(--cc-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background-color: var(--cc-primary) !important;
            box-shadow: 0 2px 8px rgba(139,26,26,.25);
        }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
        .btn-primary, .btn-primary:active {
            background-color: var(--cc-primary);
            border-color: var(--cc-primary);
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--cc-primary-hover);
            border-color: var(--cc-primary-hover);
        }
        .btn-outline-light:hover {
            color: var(--cc-primary) !important;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }
        .form-control, .form-select {
            border-radius: .75rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--cc-primary-light);
            box-shadow: 0 0 0 .2rem rgba(139,26,26,.15);
        }
        .btn { border-radius: .75rem; }
        .rounded-pill { border-radius: 50rem !important; }
        a { color: var(--cc-primary); }
        a:hover { color: var(--cc-primary-hover); }
        .alert { border-radius: .75rem; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark py-2">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">🎓 CampusConnect</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile' %}">My Profile</a>
                    </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3" type="submit">Log out</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Log in</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-light rounded-pill px-3" href="{% url 'signup' %}">Sign Up</a>
                    </li>
                {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Messages -->
    <div class="container mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Content -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
