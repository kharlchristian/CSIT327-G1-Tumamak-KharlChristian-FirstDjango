{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-4" style="color:var(--cc-primary);">My Profile</h3>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type|default:'text' }}"
                               name="{{ field.html_name }}"
                               id="{{ field.id_for_label }}"
                               class="form-control{% if field.errors %} is-invalid{% endif %}"
                               value="{{ field.value|default:'' }}"
                               {% if field.field.required %}required{% endif %}>
                        {% for error in field.errors %}
                            <div class="invalid-feedback">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Save Changes</button>
            </form>
            <a href="{% url 'dashboard' %}" class="btn btn-link text-muted mt-2 text-center">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
